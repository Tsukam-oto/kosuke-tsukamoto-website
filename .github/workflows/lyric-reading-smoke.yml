name: Lyric close-reading browser smoke
on:
  pull_request:
    paths:
      - 'lyric-constellation/**'
      - '.github/workflows/lyric-reading-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'lyric-constellation/**'
      - '.github/workflows/lyric-reading-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.57.0
      - name: Install headless Chromium and Linux dependencies
        run: npx playwright install --with-deps --only-shell chromium
      - name: Verify existing lyric-reading regression tests
        run: |
          node lyric-constellation/deep-reading.test.js
          node lyric-constellation/author-review.test.js
      - name: Browser smoke – desktop and mobile
        run: node lyric-constellation/browser-smoke.cjs
