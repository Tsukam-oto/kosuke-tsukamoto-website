name: Knowledge Library · verified-source intake
on:
  workflow_dispatch:
  schedule:
    # 12:19 JST on Mondays and Thursdays; GitHub schedules use UTC.
    - cron: '19 3 * * 1,4'
  push:
    branches: [main]
    paths:
      - 'chi-no-toshokan/research/**'
      - '.github/workflows/knowledge-evidence-collector.yml'

permissions:
  contents: write

concurrency:
  group: knowledge-evidence-collection
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the latest library
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test provenance and public-domain safety gates
        run: python -m unittest discover -s chi-no-toshokan/research -p 'test_*.py' -v

      - name: Collect candidate metadata (not verified article claims)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RESEARCH_CONTACT_EMAIL: ${{ vars.RESEARCH_CONTACT_EMAIL }}
        run: python chi-no-toshokan/research/collect.py

      - name: Create research preparation sheets from collected metadata
        run: python chi-no-toshokan/research/build_dossiers.py

      - name: Block unverifiable or unauthorized output before publishing
        run: python chi-no-toshokan/research/validate_public.py

      - name: Publish only the candidate ledger and unverified research sheets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for FILE in chi-no-toshokan/research-candidates.json chi-no-toshokan/research-dossiers.json; do
            if [ -f "$FILE" ] && git ls-files --error-unmatch "$FILE" >/dev/null 2>&1 && git diff --quiet -- "$FILE"; then
              echo "$FILE unchanged"
              continue
            fi
            CONTENT="$(base64 -w 0 "$FILE")"
            PUBLISHED=0
            for attempt in 1 2 3 4; do
              echo "Updating $FILE (attempt $attempt)"
              SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE" --jq '.sha' 2>/dev/null || true)"
              ARGS=(-f "content=$CONTENT" -f "branch=main" -f "message=Refresh unverified source research data")
              if [ -n "$SHA" ]; then
                ARGS+=(-f "sha=$SHA")
              fi
              if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" "${ARGS[@]}" >/dev/null; then
                PUBLISHED=1
                break
              fi
              sleep "$((attempt * 7))"
            done
            if [ "$PUBLISHED" -ne 1 ]; then
              echo "Could not update $FILE; no verified-claim status was modified."
              exit 1
            fi
          done
          echo "Source metadata and unverified research sheets published"
