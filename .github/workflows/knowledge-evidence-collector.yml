name: Knowledge Library · verified-source intake
on:
  workflow_dispatch:
  schedule:
    # 12:19 JST on Mondays and Thursdays; GitHub schedules use UTC.
    - cron: '19 3 * * 1,4'
  push:
    branches: [main]
    paths:
      - 'chi-no-toshokan/research/**'
      - '.github/workflows/knowledge-evidence-collector.yml'

permissions:
  contents: write

concurrency:
  group: knowledge-evidence-collection
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the latest library
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test provenance and public-domain safety gates
        run: python -m unittest discover -s chi-no-toshokan/research -p 'test_*.py' -v

      - name: Collect candidate metadata (not verified article claims)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          RESEARCH_CONTACT_EMAIL: ${{ vars.RESEARCH_CONTACT_EMAIL }}
        run: python chi-no-toshokan/research/collect.py

      - name: Publish only the public candidate ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILE="chi-no-toshokan/research-candidates.json"
          if git diff --quiet -- "$FILE"; then
            echo "Candidate ledger unchanged"
            exit 0
          fi
          CONTENT="$(base64 -w 0 "$FILE")"
          for attempt in 1 2 3 4; do
            echo "Updating public candidate ledger (attempt $attempt)"
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE" --jq '.sha')"
            if gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
              -f sha="$SHA" \
              -f content="$CONTENT" \
              -f branch="main" \
              -f message="Refresh unverified source candidates" >/dev/null; then
              echo "Candidate ledger published"
              exit 0
            fi
            sleep "$((attempt * 7))"
          done
          echo "Candidate ledger could not be published; previous data remains unchanged"
          exit 1
