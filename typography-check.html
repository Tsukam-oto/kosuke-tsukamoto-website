<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>組版の幅別検証（作業用）</title><style>body{margin:0;background:#ddd;font:14px/1.5 sans-serif}header{padding:10px;background:#fff;position:relative;z-index:1;display:flex;gap:12px;flex-wrap:wrap}button,select{min-height:44px}iframe{display:block;border:0;background:white;margin:12px}pre{white-space:pre-wrap;max-height:65px;overflow:auto;margin:12px}#log{font-size:12px}</style><header><label>幅<select id="width"><option>320</option><option>360</option><option>375</option><option selected>390</option><option>430</option><option>512</option><option>768</option><option>834</option><option>1024</option><option>1194</option><option>1280</option><option>1440</option></select></label><label>高さ<select id="height"><option>640</option><option>768</option><option selected>844</option><option>1024</option><option>1194</option></select></label><label>ページ<select id="page"><option value="/">トップ</option><option value="/#lyric-box">LYRIC BOX</option><option value="/music-education/#questions-title">教育：3つの問い</option><option value="/works/#timeline">作品年表</option><option value="/works/umi-ni-made-anata-wa-hon-wo-tsurete-kite/">長い作品名</option><option value="/lyrics/#korekara">詩集</option><option value="/voice-box/">VOICE BOX</option><option value="/contact/">お問い合わせ</option><option value="/special-thanks/">SPECIAL THANKS</option></select></label><label><input type="checkbox" id="double">文字200%（計算済み文字サイズを2倍）</label><button id="show">表示</button><button id="draw">再抽選</button><button id="long">長文を表示（表示検査のみ）</button><button id="audit">この画面を検査</button><button id="export">検査結果を保存</button><label>検査範囲<select id="scope"><option value="all">全34ページ</option><option value="changed">修正した5ページ</option></select></label><button id="matrix">全ページ・全幅を検査</button></header><pre id="log"></pre><iframe id="screen" title="実サイトを指定CSS幅で表示"></iframe><script>
const frame=document.querySelector('#screen'), log=document.querySelector('#log');
const widths=[320,360,375,390,430,512,768,834,1024,1194,1280,1440];
const paths=["/", "/contact/", "/lyrics/", "/music-education/", "/profile/", "/school-song/", "/special-thanks/", "/special-thanks/eastgate/", "/voice-box/", "/works/", "/works/all-around-you/", "/works/aoiro-no-shi/", "/works/clarinet-piano-fukei/", "/works/clarinet-piano-ongi/", "/works/fanfare-sora/", "/works/futashika/", "/works/hana-to-konetsu/", "/works/hibi/", "/works/kono-fuukei-ni-yosete/", "/works/kotoba-wo-tebanashite/", "/works/moshi-kotoba-ga/", "/works/ongaku-no-fuukei/", "/works/ongaku-no-fuukei/anata-to/", "/works/ongaku-no-fuukei/asa-ni-nattara/", "/works/ongaku-no-fuukei/deai/", "/works/ongaku-no-fuukei/harewataru-sora/", "/works/ongaku-no-fuukei/haru-ni-afurete/", "/works/ongaku-no-fuukei/korekara/", "/works/ongaku-no-fuukei/natsu-wo-suikonde/", "/works/ongaku-no-fuukei/negai/", "/works/ongaku-no-fuukei/tadanaka/", "/works/umi-ni-made-anata-wa-hon-wo-tsurete-kite/", "/works/undokai-fanfare-4-asa/", "/works/undokai-fanfare/"];
let loadSequence=0;let results=[];window.qaResults=results;
const load=(path,w,h=844,double=false)=>new Promise(resolve=>{frame.style.width=w+'px';frame.style.height=h+'px';frame.onload=async()=>{const d=frame.contentDocument;await d.fonts.ready;if(double){const sizes=[...d.querySelectorAll('body,body *')].map(e=>[e,getComputedStyle(e).fontSize]);sizes.forEach(([e,s])=>e.style.setProperty('font-size',(parseFloat(s)*2)+'px','important'));}requestAnimationFrame(()=>requestAnimationFrame(resolve));};const url=new URL(path,location.href);url.searchParams.set('layout-check',String(++loadSequence));frame.src=url.href;});
function audit(){const d=frame.contentDocument,w=frame.contentWindow;const overflow=[...d.querySelectorAll('body *')].filter(e=>{let r=e.getBoundingClientRect(),s=w.getComputedStyle(e);return r.width&&r.height&&s.display!=='none'&&(r.right>w.innerWidth+2||r.left < -2)&&!e.closest('[hidden],.hp-field')&&(!e.closest('details:not([open])')||e.closest('summary'))}).slice(0,15).map(e=>({tag:e.tagName,cls:e.className,text:e.textContent.trim().slice(0,45),right:Math.round(e.getBoundingClientRect().right)}));return{path:frame.contentWindow.location.pathname,width:w.innerWidth,height:w.innerHeight,text200:document.querySelector('#double').checked,scrollWidth:d.documentElement.scrollWidth,overflow,columns:d.querySelector('#lyric-stage')?w.getComputedStyle(d.querySelector('#lyric-stage')).gridTemplateColumns:null};}
document.querySelector('#show').onclick=async()=>{await load(document.querySelector('#page').value,+document.querySelector('#width').value,+document.querySelector('#height').value,document.querySelector('#double').checked);log.textContent=JSON.stringify(audit(),null,2)};
document.querySelector('#audit').onclick=()=>log.textContent=JSON.stringify(audit(),null,2);
document.querySelector('#draw').onclick=()=>frame.contentDocument.querySelector('#lyric-draw')?.click();
document.querySelector('#long').onclick=()=>{const nodes=frame.contentDocument.querySelectorAll('.fragment-text');['変わってしまうから','あなたの成功を共に喜ぶこと'].forEach((t,i)=>{if(nodes[i])nodes[i].innerHTML=(i?['あなたの','成功を','共に','喜ぶこと']:['変わって','しまうから']).map(p=>'<span class="lyric-unit">'+p+'</span>').join('')});log.textContent='表示のみの長文テスト。共有機能テストには使用しません。'};
document.querySelector('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(results,null,2)],{type:'application/json'}));a.download='typography-matrix-'+(document.querySelector('#double').checked?'200':'100')+'.json';a.click();URL.revokeObjectURL(a.href)};
document.querySelector('#matrix').onclick=async()=>{document.querySelector('#matrix').disabled=true;results.length=0;const matrixPaths=document.querySelector('#scope').value==='changed'?['/','/lyrics/','/profile/','/music-education/','/works/umi-ni-made-anata-wa-hon-wo-tsurete-kite/']:paths;for(const width of widths)for(const path of matrixPaths){await load(path,width,+document.querySelector('#height').value,document.querySelector('#double').checked);const r=audit();results.push(r);log.textContent=results.length+'/'+(widths.length*matrixPaths.length)+'\n'+JSON.stringify(r,null,2);}log.textContent='完了 '+results.length+'画面 / 横幅超過 '+results.filter(r=>r.scrollWidth>r.width+1).length+' / 要確認要素 '+results.filter(r=>r.overflow.length).length+'\n'+JSON.stringify(results.filter(r=>r.overflow.length||r.scrollWidth>r.width+1),null,2);document.querySelector('#matrix').disabled=false;};
document.querySelector('#show').click();
</script></html>
